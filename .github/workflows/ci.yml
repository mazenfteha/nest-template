  #         POSTGRES_PASSWORD: postgres
  #         POSTGRES_DB: nest_template_test
  #       ports: ['5432:5432']
  #       options: >-
  #         --health-cmd "pg_isready -U postgres"
  #         --health-interval 10s --health-timeout 5s --health-retries 5
