name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # matches Dockerfile NODE_VERSION
          cache: npm

      # Use `npm install`, not `npm ci`: the committed package-lock.json is
      # generated on Windows, and `npm ci` on the Linux runner computes a
      # different ideal tree and rejects the lock. `npm install` reconciles it
      # instead of asserting an exact match.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate # types must exist before lint/build (no DB needed)

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

